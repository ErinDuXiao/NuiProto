name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# gh-pages ブランチへ push するだけなので contents: write で足りる。
# Pages API（configure-pages / deploy-pages）は GITHUB_TOKEN の権限では
# 通らなかったため使わない。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 手動実行では任意の ref を選べる。master 以外から公開すると、
    # 古い内容で gh-pages を force push して公開サイトを巻き戻してしまう。
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # 公開物を force push する権限を持つジョブなので、
      # 可変のタグではなくコミット SHA で固定する
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたものを公開しない。型チェックとテストを通ってからビルドする
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: dist を gh-pages ブランチへ公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Jekyll に触らせない。_ 始まりのファイルが落とされる事故を防ぐ
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
